<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>La Cantina — Menú Digital</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: #FAFAF8;
    color: #1A1A1A;
    overscroll-behavior: none;
    overflow-x: hidden;
  }

  :root {
    --yellow: #FFD000;
    --yellow-deep: #F5C400;
    --green: #25D366;
    --green-deep: #1DA851;
    --green-light: rgba(37,211,102,0.10);
    --red: #E8271A;
    --red-deep: #C41F14;
    --white: #FFFFFF;
    --bg: #FAFAF8;
    --surface: #FFFFFF;
    --text: #1A1A1A;
    --text-muted: #888;
    --border: #EBEBEB;
    --radius: 16px;
    --radius-sm: 10px;
    --shadow: 0 4px 24px rgba(0,0,0,0.10);
    --shadow-lg: 0 12px 48px rgba(0,0,0,0.16);
    --header-h: 64px;
    --cart-bar-h: 76px;
  }

  /* HEADER */
  .header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    height: var(--header-h);
    background: var(--white);
    border-bottom: 1.5px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 16px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
  }
  .logo { display: flex; align-items: center; gap: 8px; }
  .logo-icon {
    width: 38px; height: 38px;
    background: var(--yellow);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Bebas Neue', cursive;
    font-size: 22px; color: var(--text);
  }
  .logo-text { font-family: 'Bebas Neue', cursive; font-size: 22px; letter-spacing: 1px; color: var(--text); line-height: 1; }
  .logo-sub { font-size: 9px; color: var(--text-muted); letter-spacing: 2px; text-transform: uppercase; display: block; margin-top: -1px; }

  /* NAV PILLS */
  .nav-scroll {
    display: flex; gap: 8px;
    overflow-x: auto; -webkit-overflow-scrolling: touch;
    scrollbar-width: none; padding: 8px 16px;
    background: var(--white);
    border-bottom: 1.5px solid var(--border);
    position: sticky; top: var(--header-h); z-index: 90;
  }
  .nav-scroll::-webkit-scrollbar { display: none; }
  .nav-pill {
    flex-shrink: 0; padding: 7px 16px; border-radius: 50px;
    border: 1.5px solid var(--border); background: var(--white);
    color: var(--text-muted); font-family: 'DM Sans', sans-serif;
    font-size: 13px; font-weight: 600; cursor: pointer;
    transition: all .2s ease; white-space: nowrap;
  }
  .nav-pill.active {
    background: var(--green); border-color: var(--green); color: var(--white);
    box-shadow: 0 4px 12px rgba(37,211,102,0.35);
  }

  /* MAIN */
  .main { padding-top: calc(var(--header-h) + 56px); padding-bottom: calc(var(--cart-bar-h) + 24px); }

  /* PROMO SLIDER */
  .promo-section { padding: 16px 0 8px; }
  .promo-wrapper {
    overflow: hidden; position: relative;
    margin: 0 16px; border-radius: var(--radius);
    cursor: grab;
    user-select: none;
  }
  .promo-wrapper:active { cursor: grabbing; }
  .promo-track {
    display: flex;
    transition: transform .45s cubic-bezier(.4,0,.2,1);
    will-change: transform;
  }
  .promo-track.dragging { transition: none; }
  .promo-slide {
    min-width: 100%; position: relative;
    border-radius: var(--radius); overflow: hidden;
    aspect-ratio: 16/7; background: var(--yellow);
    pointer-events: none;
  }
  .promo-slide img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .promo-overlay {
    position: absolute; inset: 0;
    background: linear-gradient(90deg, rgba(0,0,0,0.55) 0%, transparent 65%);
    display: flex; flex-direction: column; justify-content: flex-end;
    padding: 18px 20px;
  }
  .promo-badge {
    background: var(--yellow); color: var(--text);
    font-size: 10px; font-weight: 700;
    padding: 3px 10px; border-radius: 50px;
    width: fit-content; margin-bottom: 6px;
    text-transform: uppercase; letter-spacing: 0.5px;
  }
  .promo-title { font-family: 'Bebas Neue', cursive; font-size: 26px; color: var(--white); line-height: 1.05; letter-spacing: 0.5px; }
  .promo-sub { font-size: 12px; color: rgba(255,255,255,0.8); margin-top: 2px; }
  .promo-dots { display: flex; gap: 5px; justify-content: center; margin-top: 10px; }
  .promo-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--border); transition: all .3s; cursor: pointer;
  }
  .promo-dot.active { background: var(--yellow); width: 18px; border-radius: 3px; }

  /* SECTION HEADER */
  .section-header { padding: 20px 16px 10px; display: flex; align-items: baseline; gap: 10px; }
  .section-title { font-family: 'Bebas Neue', cursive; font-size: 22px; letter-spacing: 0.5px; }
  .section-count { font-size: 12px; color: var(--text-muted); }

  /* PRODUCT LIST */
  .product-list { display: flex; flex-direction: column; gap: 1px; padding: 0 16px; }
  .product-card {
    background: var(--white); border-radius: var(--radius);
    display: flex; align-items: center; gap: 14px;
    padding: 12px; cursor: default;
    transition: box-shadow .2s;
    position: relative; overflow: hidden;
    margin-bottom: 10px; border: 1.5px solid var(--border);
  }
  .product-card-img {
    width: 88px; height: 88px; border-radius: 12px;
    object-fit: cover; flex-shrink: 0; background: #F0EEE9;
  }
  .product-info { flex: 1; min-width: 0; }
  .product-name { font-size: 15px; font-weight: 600; line-height: 1.2; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .product-desc { font-size: 12px; color: var(--text-muted); line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .product-price-row { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; }
  .product-price { font-size: 16px; font-weight: 700; color: var(--text); }
  .add-btn {
    width: 32px; height: 32px; border-radius: 50%;
    background: var(--green); border: none;
    color: var(--white); font-size: 22px; line-height: 1;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: transform .15s, background .2s; flex-shrink: 0;
    box-shadow: 0 3px 10px rgba(30,138,74,0.30);
  }
  .add-btn:active { transform: scale(.88); background: var(--green-deep); }

  /* MODAL */
  .modal-backdrop {
    position: fixed; inset: 0; z-index: 200;
    background: rgba(0,0,0,0); transition: background .3s; pointer-events: none;
  }
  .modal-backdrop.open { background: rgba(0,0,0,0.55); pointer-events: all; }
  .modal {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 201;
    background: var(--bg); border-radius: 24px 24px 0 0;
    max-height: 92vh; overflow-y: auto;
    transform: translateY(110%);
    transition: transform .38s cubic-bezier(.4,0,.2,1);
    -webkit-overflow-scrolling: touch;
    padding-bottom: 90px;
  }
  .modal.open { transform: translateY(0); }
  .modal-drag { width: 40px; height: 4px; border-radius: 2px; background: #DDD; margin: 10px auto 0; }
  .modal-hero { position: relative; width: 100%; aspect-ratio: 4/3; overflow: hidden; }
  .modal-hero img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .modal-body { padding: 20px 16px 0; }
  .modal-name { font-family: 'Bebas Neue', cursive; font-size: 28px; letter-spacing: 0.5px; line-height: 1.05; }
  .modal-price { font-size: 22px; font-weight: 700; color: var(--text); margin-top: 4px; }
  .modal-desc { font-size: 14px; color: var(--text-muted); line-height: 1.6; margin-top: 10px; }
  .modal-section-title {
    font-size: 15px; font-weight: 700; margin: 20px 0 10px;
    display: flex; align-items: center; gap: 6px;
  }
  .modal-section-title::before { content: ''; width: 4px; height: 16px; background: var(--yellow); border-radius: 2px; display: block; }
  .modal-input {
    width: 100%; padding: 12px 14px;
    border: 1.5px solid var(--border); border-radius: var(--radius-sm);
    font-family: 'DM Sans', sans-serif; font-size: 14px;
    resize: none; background: var(--white); color: var(--text);
    outline: none; transition: border-color .2s;
  }
  .modal-input:focus { border-color: var(--yellow); }

  /* RECO LIST — contador estilo + / − */
  .reco-list { display: flex; flex-direction: column; gap: 8px; }
  .reco-item {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 12px;
    border: 1.5px solid var(--border); border-radius: var(--radius-sm);
    background: var(--white);
    transition: border-color .2s, background .2s;
  }
  .reco-item.has-qty { border-color: var(--yellow); background: rgba(255,208,0,0.10); }
  .reco-img { width: 50px; height: 50px; border-radius: 8px; object-fit: cover; flex-shrink: 0; }
  .reco-info { flex: 1; }
  .reco-name { font-size: 13px; font-weight: 600; }
  .reco-price { font-size: 12px; color: var(--text); font-weight: 600; margin-top: 2px; }
  /* contador */
  .reco-ctrl { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .reco-btn {
    width: 28px; height: 28px; border-radius: 50%;
    border: 1.5px solid var(--green);
    background: transparent; color: var(--green);
    font-size: 18px; font-weight: 700; line-height: 1;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: background .15s, color .15s;
  }
  .reco-btn:active { background: var(--green); color: var(--white); }
  .reco-qty { font-size: 15px; font-weight: 700; min-width: 16px; text-align: center; color: var(--text); }
  /* el botón − solo se muestra cuando qty > 0 */
  .reco-btn.minus { display: none; }
  .reco-item.has-qty .reco-btn.minus { display: flex; }
  .reco-item.has-qty .reco-qty { display: block; }
  .reco-qty { display: none; }

  /* MODAL STICKY BAR */
  .modal-sticky {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--white); padding: 12px 16px;
    border-top: 1.5px solid var(--border);
    display: flex; align-items: center; gap: 12px;
    z-index: 202;
    transform: translateY(100%);
    transition: transform .38s cubic-bezier(.4,0,.2,1);
    box-shadow: 0 -8px 24px rgba(0,0,0,0.08);
  }
  .modal-sticky.open { transform: translateY(0); }
  .qty-ctrl { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
  .qty-btn {
    width: 36px; height: 36px; border-radius: 50%;
    border: 2px solid var(--border); background: var(--white);
    font-size: 22px; cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: all .15s; color: var(--text); font-weight: 600; line-height: 1;
  }
  .qty-btn:active { background: var(--border); }
  .qty-num { font-size: 18px; font-weight: 700; min-width: 20px; text-align: center; }
  .add-cart-btn {
    flex: 1; padding: 14px;
    background: var(--green); border: none; border-radius: 50px;
    color: var(--white); font-family: 'DM Sans', sans-serif;
    font-size: 15px; font-weight: 700; cursor: pointer;
    display: flex; align-items: center; justify-content: space-between;
    transition: background .2s, transform .15s;
    box-shadow: 0 4px 16px rgba(37,211,102,0.35);
  }
  .add-cart-btn:active { transform: scale(.97); background: var(--green-deep); }
  .add-cart-btn .btn-total { font-size: 15px; font-weight: 700; }

  /* CART BAR */
  .cart-bar {
    position: fixed; bottom: 16px; left: 16px; right: 16px; z-index: 150;
    background: var(--text); border-radius: 18px; padding: 12px 16px;
    display: flex; align-items: center; gap: 12px;
    transform: translateY(120px); transition: transform .38s cubic-bezier(.4,0,.2,1);
    box-shadow: 0 8px 32px rgba(0,0,0,0.25); cursor: pointer; user-select: none;
  }
  .cart-bar.visible { transform: translateY(0); }
  .cart-imgs { display: flex; gap: -6px; position: relative; width: 60px; flex-shrink: 0; }
  .cart-thumb {
    width: 36px; height: 36px; border-radius: 8px; object-fit: cover;
    border: 2px solid var(--text); position: relative;
  }
  .cart-thumb:nth-child(2) { margin-left: -10px; }
  .cart-bar-info { flex: 1; }
  .cart-bar-items { font-size: 11px; color: rgba(255,255,255,0.6); }
  .cart-bar-total { font-size: 16px; font-weight: 700; color: var(--white); }
  .cart-bar-btn {
    background: var(--green); color: var(--white);
    border: none; border-radius: 12px; padding: 8px 14px;
    font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 700;
    cursor: pointer; flex-shrink: 0; transition: transform .15s;
  }
  .cart-bar-btn:active { transform: scale(.95); }

  /* CART DRAWER */
  .drawer-backdrop { position: fixed; inset: 0; z-index: 300; background: rgba(0,0,0,0); transition: background .3s; pointer-events: none; }
  .drawer-backdrop.open { background: rgba(0,0,0,0.5); pointer-events: all; }
  .drawer {
    position: fixed; right: 0; top: 0; bottom: 0; z-index: 301;
    width: min(100vw, 420px); background: var(--bg);
    transform: translateX(105%); transition: transform .38s cubic-bezier(.4,0,.2,1);
    display: flex; flex-direction: column;
    box-shadow: -8px 0 32px rgba(0,0,0,0.15);
  }
  .drawer.open { transform: translateX(0); }
  .drawer-header {
    padding: 20px 16px 16px; border-bottom: 1.5px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    background: var(--white); flex-shrink: 0;
  }
  .drawer-title { font-family: 'Bebas Neue', cursive; font-size: 24px; letter-spacing: 0.5px; }
  .drawer-close {
    width: 36px; height: 36px; border-radius: 50%;
    border: 1.5px solid var(--border); background: var(--white);
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    font-size: 18px; color: var(--text); transition: background .15s;
  }
  .drawer-close:active { background: var(--border); }
  .drawer-body { flex: 1; overflow-y: auto; padding: 12px 16px; -webkit-overflow-scrolling: touch; }
  .drawer-empty { text-align: center; padding: 60px 20px; color: var(--text-muted); }
  .drawer-empty-icon { font-size: 48px; margin-bottom: 12px; }
  .drawer-empty-text { font-size: 16px; font-weight: 600; }

  /* CART ITEMS */
  .cart-item-wrap { position: relative; margin-bottom: 10px; border-radius: var(--radius-sm); overflow: hidden; }
  .cart-item-delete-bg {
    position: absolute; inset: 0; background: var(--red);
    display: flex; align-items: center; justify-content: flex-end;
    padding-right: 20px; border-radius: var(--radius-sm);
    opacity: 0; pointer-events: none; transition: opacity .2s;
  }
  .cart-item-delete-bg.visible { opacity: 1; pointer-events: all; }
  .delete-label { color: var(--white); font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
  .cart-item {
    background: var(--white); border-radius: var(--radius-sm);
    display: flex; align-items: center; gap: 12px; padding: 12px;
    border: 1.5px solid var(--border); position: relative; z-index: 1;
    transform: translateX(0); transition: transform .25s ease; touch-action: pan-y;
  }
  .cart-item-img { width: 58px; height: 58px; border-radius: 8px; object-fit: cover; flex-shrink: 0; }
  .cart-item-info { flex: 1; min-width: 0; }
  .cart-item-name { font-size: 14px; font-weight: 600; }
  .cart-item-price { font-size: 14px; font-weight: 700; color: var(--text); margin-top: 2px; }
  .cart-item-note { font-size: 11px; color: var(--text-muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cart-qty-ctrl { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .cart-qty-btn {
    width: 30px; height: 30px; border-radius: 50%;
    border: 1.5px solid var(--border); background: var(--white);
    font-size: 18px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all .15s; font-weight: 600; color: var(--text);
  }
  .cart-qty-btn.del-btn { border-color: var(--red); color: var(--red); font-size: 16px; }
  .cart-qty-btn:active { background: var(--border); }
  .cart-qty-num { font-size: 15px; font-weight: 700; min-width: 18px; text-align: center; }

  /* DRAWER FOOTER */
  .drawer-footer { padding: 16px; border-top: 1.5px solid var(--border); background: var(--white); flex-shrink: 0; }
  .drawer-total-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .drawer-total-label { font-size: 15px; color: var(--text-muted); }
  .drawer-total-val { font-family: 'Bebas Neue', cursive; font-size: 28px; letter-spacing: 0.5px; color: var(--text); }
  .pay-btn {
    width: 100%; padding: 16px;
    background: var(--green); border: none; border-radius: 50px;
    color: var(--white); font-family: 'DM Sans', sans-serif;
    font-size: 16px; font-weight: 700; cursor: pointer;
    transition: background .2s, transform .15s;
    box-shadow: 0 6px 20px rgba(37,211,102,0.35); letter-spacing: 0.3px;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .pay-btn:active { transform: scale(.98); background: var(--green-deep); }

  /* TOAST */
  .toast {
    position: fixed; top: 80px; left: 50%; transform: translateX(-50%) translateY(-20px);
    background: var(--text); color: var(--white);
    padding: 10px 20px; border-radius: 50px;
    font-size: 13px; font-weight: 600; z-index: 500;
    opacity: 0; transition: all .3s; pointer-events: none; white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* CLOSE BTN MODAL */
  .modal-close {
    position: absolute; top: 12px; right: 12px;
    width: 34px; height: 34px; border-radius: 50%;
    background: rgba(0,0,0,0.45); border: none; cursor: pointer;
    color: var(--white); font-size: 18px;
    display: flex; align-items: center; justify-content: center;
    z-index: 5; transition: background .2s;
  }
  .modal-close:hover { background: rgba(0,0,0,0.7); }

  /* ===== ADDRESS MODAL ===== */
  .addr-backdrop {
    position: fixed; inset: 0; z-index: 400;
    background: rgba(0,0,0,0); transition: background .3s; pointer-events: none;
  }
  .addr-backdrop.open { background: rgba(0,0,0,0.55); pointer-events: all; }
  .addr-modal {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 401;
    background: var(--bg); border-radius: 24px 24px 0 0;
    max-height: 95vh; display: flex; flex-direction: column;
    transform: translateY(110%);
    transition: transform .38s cubic-bezier(.4,0,.2,1);
    overflow: hidden;
  }
  .addr-modal.open { transform: translateY(0); }
  .addr-header {
    display: flex; align-items: center; gap: 10px;
    padding: 14px 16px 10px; flex-shrink: 0;
    background: var(--white); border-bottom: 1.5px solid var(--border);
  }
  .addr-back {
    width: 34px; height: 34px; border-radius: 50%;
    border: 1.5px solid var(--border); background: var(--white);
    font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center;
    color: var(--text); flex-shrink: 0;
  }
  .addr-title { font-size: 16px; font-weight: 700; }
  .addr-map-wrap {
    position: relative; flex-shrink: 0;
    height: 260px; background: #e8f0e8;
    overflow: hidden;
  }
  .addr-map { width: 100%; height: 100%; }
  /* Pin centrado sobre el mapa — siempre encima de Leaflet */
  .addr-map-wrap { position: relative !important; }
  .addr-pin {
    position: absolute !important;
    top: 50% !important; left: 50% !important;
    transform: translate(-50%, -100%) !important;
    display: flex; flex-direction: column; align-items: center;
    pointer-events: none;
    z-index: 9999 !important;
    filter: drop-shadow(0 4px 10px rgba(0,0,0,0.4));
  }
  .addr-pin.pin-drag {
    transform: translate(-50%, -115%) scale(1.1) !important;
    transition: transform .15s ease !important;
  }
  .addr-pin.pin-drop {
    animation: pinDrop .35s ease forwards;
  }
  @keyframes pinDrop {
    0%   { transform: translate(-50%, -115%) scale(1.1); }
    60%  { transform: translate(-50%, -93%)  scale(0.93); }
    80%  { transform: translate(-50%, -103%) scale(1.03); }
    100% { transform: translate(-50%, -100%) scale(1); }
  }
  .addr-pin-shadow {
    width: 14px; height: 5px;
    background: rgba(0,0,0,0.3);
    border-radius: 50%;
    margin-top: 3px;
  }
  /* Botón de geolocalización */
  .addr-locate-btn {
    position: absolute; bottom: 12px; right: 12px; z-index: 10;
    width: 40px; height: 40px; border-radius: 50%;
    background: var(--white); border: 1.5px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    color: var(--green); transition: background .15s;
  }
  .addr-locate-btn:active { background: var(--border); }
  /* Body del modal */
  .addr-body { padding: 16px; overflow-y: auto; flex: 1; }
  .addr-street-row {
    display: flex; align-items: flex-start; gap: 10px;

/* ============= STATE ============= */
let cart = [];
let modalProduct = null;
let modalQty = 1;

let recoQtys = {};

let promoTimer = null;
let todayPromos = [];

/* ============= INIT ============= */
document.addEventListener('DOMContentLoaded', () => {
  buildNav();
  buildSections();
  buildPromos();
  bindModal();
  bindCartBar();
  bindDrawer();
  bindAddrModal();
  startScrollSpy();
});

/* ============= NAV ============= */
function buildNav() {
  const nav = document.getElementById('navScroll');
  menuData.forEach((sec, i) => {
    const pill = document.createElement('button');
    pill.className = 'nav-pill' + (i === 0 ? ' active' : '');
    pill.textContent = sec.name;
    pill.dataset.target = sec.id;
    pill.addEventListener('click', () => {
      document.getElementById('sec-' + sec.id).scrollIntoView({ behavior: 'smooth' });
    });
    nav.appendChild(pill);
  });
}

/* ============= SECTIONS ============= */
function buildSections() {
  const container = document.getElementById('menuSections');
  menuData.forEach(sec => {
    const section = document.createElement('section');
    section.id = 'sec-' + sec.id;
    section.dataset.section = sec.id;
    section.innerHTML = `
      <div class="section-header">
        <span class="section-title">${sec.name}</span>
        <span class="section-count">${sec.items.length} productos</span>
      </div>
      <div class="product-list" id="list-${sec.id}"></div>
    `;
    container.appendChild(section);
    const list = section.querySelector('.product-list');
    sec.items.forEach(p => list.appendChild(buildProductCard(p)));
  });
}

function buildProductCard(p) {
  const card = document.createElement('div');
  card.className = 'product-card';
  card.innerHTML = `
    <img class="product-card-img" src="${p.img}" alt="${p.name}" loading="lazy">
    <div class="product-info">
      <div class="product-name">${p.name}</div>
      <div class="product-desc">${p.desc}</div>
      <div class="product-price-row">
        <span class="product-price">$${p.price}</span>
        <button class="add-btn" aria-label="Agregar ${p.name}">+</button>
      </div>
    </div>
  `;
  // El botón + abre el modal
  card.querySelector('.add-btn').addEventListener('click', e => {
    e.stopPropagation();
    openModal(p);
  });
  // La tarjeta en sí no hace nada especial al hacer click
  return card;
}

/* ============= PROMO SLIDER con swipe táctil ============= */
function buildPromos() {
  const day = new Date().getDay();
  todayPromos = promosByDay[day] || promosByDay[1];
  const track = document.getElementById('promoTrack');
  const dots = document.getElementById('promoDots');
  track.innerHTML = '';
  dots.innerHTML = '';

  todayPromos.forEach((p, i) => {
    const slide = document.createElement('div');
    slide.className = 'promo-slide';
    slide.innerHTML = `
      <img src="${p.img}" alt="${p.title}" loading="lazy">
      <div class="promo-overlay">
        <span class="promo-badge">${p.badge}</span>
        <div class="promo-title">${p.title}</div>
        <div class="promo-sub">${p.sub}</div>
      </div>
    `;
    track.appendChild(slide);

    const dot = document.createElement('div');
    dot.className = 'promo-dot' + (i === 0 ? ' active' : '');
    dot.addEventListener('click', () => goToPromo(i));
    dots.appendChild(dot);
  });

  goToPromo(0);
  if (todayPromos.length > 1) {
    if (promoTimer) clearInterval(promoTimer);
    promoTimer = setInterval(() => {
      promoIndex = (promoIndex + 1) % todayPromos.length;
      goToPromo(promoIndex);
    }, 30000);
  }

  // Swipe táctil en el promo wrapper
  const wrapper = document.getElementById('promoWrapper');
  let tsX = 0, tsMoved = false;

  wrapper.addEventListener('touchstart', e => {
    tsX = e.touches[0].clientX;
    tsMoved = false;
    track.classList.add('dragging');
  }, { passive: true });

  wrapper.addEventListener('touchmove', e => {
    const dx = e.touches[0].clientX - tsX;
    if (Math.abs(dx) > 5) tsMoved = true;
    const base = -promoIndex * 100;
    const pct = (dx / wrapper.offsetWidth) * 100;
    track.style.transform = `translateX(calc(${base}% + ${Math.max(Math.min(dx, 80), -80)}px))`;
  }, { passive: true });

  wrapper.addEventListener('touchend', e => {
    track.classList.remove('dragging');
    const dx = e.changedTouches[0].clientX - tsX;
    const threshold = wrapper.offsetWidth * 0.25;
    if (tsMoved && Math.abs(dx) > threshold) {
      if (dx < 0 && promoIndex < todayPromos.length - 1) goToPromo(promoIndex + 1);
      else if (dx > 0 && promoIndex > 0) goToPromo(promoIndex - 1);
      else goToPromo(promoIndex); // rebote
    } else {
      goToPromo(promoIndex);
    }
  });

  // Swipe con mouse (desktop)
  let msX = 0, msDown = false;
  wrapper.addEventListener('mousedown', e => { msX = e.clientX; msDown = true; });
  wrapper.addEventListener('mousemove', e => {
    if (!msDown) return;
    const dx = e.clientX - msX;
    const base = -promoIndex * 100;
    track.classList.add('dragging');
    track.style.transform = `translateX(calc(${base}% + ${Math.max(Math.min(dx, 80), -80)}px))`;
  });
  wrapper.addEventListener('mouseup', e => {
    if (!msDown) return;
    msDown = false;
    track.classList.remove('dragging');
    const dx = e.clientX - msX;
    const threshold = wrapper.offsetWidth * 0.2;
    if (Math.abs(dx) > threshold) {
      if (dx < 0 && promoIndex < todayPromos.length - 1) goToPromo(promoIndex + 1);
      else if (dx > 0 && promoIndex > 0) goToPromo(promoIndex - 1);
      else goToPromo(promoIndex);
    } else {
      goToPromo(promoIndex);
    }
  });
  wrapper.addEventListener('mouseleave', () => {
    if (msDown) { msDown = false; track.classList.remove('dragging'); goToPromo(promoIndex); }
  });
}

function goToPromo(idx) {
  promoIndex = idx;
  document.getElementById('promoTrack').style.transform = `translateX(-${idx * 100}%)`;
  document.querySelectorAll('.promo-dot').forEach((d, i) => d.classList.toggle('active', i === idx));
}

/* ============= SCROLL SPY ============= */
function startScrollSpy() {
  const sections = document.querySelectorAll('section[data-section]');
  const pills = document.querySelectorAll('.nav-pill');
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(e => {
      if (e.isIntersecting) {
        pills.forEach(p => p.classList.toggle('active', p.dataset.target === e.target.dataset.section));
        const active = document.querySelector('.nav-pill.active');
        if (active) active.scrollIntoView({ behavior:'smooth', block:'nearest', inline:'center' });
      }
    });
  }, { rootMargin: '-30% 0px -60% 0px' });
  sections.forEach(s => observer.observe(s));
}

/* ============= MODAL ============= */
function bindModal() {
  document.getElementById('modalClose').addEventListener('click', closeModal);
  document.getElementById('modalBackdrop').addEventListener('click', closeModal);
  document.getElementById('qtyMinus').addEventListener('click', () => { if (modalQty > 1) { modalQty--; updateModalQty(); } });
  document.getElementById('qtyPlus').addEventListener('click', () => { modalQty++; updateModalQty(); });
  document.getElementById('addCartBtn').addEventListener('click', addToCartFromModal);
}

function openModal(product) {
  modalProduct = product;
  modalQty = 1;
  recoQtys = {};
  document.getElementById('modalImg').src = product.img;
  document.getElementById('modalName').textContent = product.name;
  document.getElementById('modalPrice').textContent = '$' + product.price;
  document.getElementById('modalDesc').textContent = product.desc;
  document.getElementById('modalNotes').value = '';
  buildRecos(product);
  updateModalQty();
  document.getElementById('modalBackdrop').classList.add('open');
  document.getElementById('productModal').classList.add('open');
  document.getElementById('modalSticky').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  document.getElementById('modalBackdrop').classList.remove('open');
  document.getElementById('productModal').classList.remove('open');
  document.getElementById('modalSticky').classList.remove('open');
  document.body.style.overflow = '';
  setTimeout(() => { modalProduct = null; }, 400);
}

/* ============= RECOMENDACIONES con contador ============= */
function buildRecos(product) {
  const list = document.getElementById('recoList');
  list.innerHTML = '';
  recoProducts.filter(r => r.id !== product.id).slice(0, 3).forEach(r => {
    recoQtys[r.id] = 0;
    const el = document.createElement('div');
    el.className = 'reco-item';
    el.dataset.recoid = r.id;
    el.innerHTML = `
      <img class="reco-img" src="${r.img}" alt="${r.name}">
      <div class="reco-info">
        <div class="reco-name">${r.name}</div>
        <div class="reco-price">+$${r.price}</div>
      </div>
      <div class="reco-ctrl">
        <button class="reco-btn minus" data-recoid="${r.id}" aria-label="Quitar ${r.name}">−</button>
        <span class="reco-qty" data-recoid="${r.id}">0</span>
        <button class="reco-btn plus" data-recoid="${r.id}" aria-label="Agregar ${r.name}">+</button>
      </div>
    `;
    el.querySelector('.reco-btn.plus').addEventListener('click', () => changeRecoQty(r, el, 1));
    el.querySelector('.reco-btn.minus').addEventListener('click', () => changeRecoQty(r, el, -1));
    list.appendChild(el);
  });
}

function changeRecoQty(r, el, delta) {
  recoQtys[r.id] = Math.max(0, (recoQtys[r.id] || 0) + delta);
  const qty = recoQtys[r.id];
  el.querySelector('.reco-qty').textContent = qty;
  if (qty > 0) el.classList.add('has-qty');
  else el.classList.remove('has-qty');
  updateModalQty();
}

function getSelectedRecos() {
  const result = [];
  recoProducts.forEach(r => {
    if (recoQtys[r.id] && recoQtys[r.id] > 0) {
      for (let i = 0; i < recoQtys[r.id]; i++) result.push(r);
    }
  });
  return result;
}

function updateModalQty() {
  const recoTotal = Object.entries(recoQtys).reduce((s, [id, qty]) => {
    const r = recoProducts.find(x => x.id === id);
    return s + (r ? r.price * qty : 0);
  }, 0);
  const total = (modalProduct ? modalProduct.price + recoTotal : 0) * modalQty;
  document.getElementById('qtyNum').textContent = modalQty;
  document.getElementById('btnTotal').textContent = '$' + total;
}

function addToCartFromModal() {
  if (!modalProduct) return;
  const notes = document.getElementById('modalNotes').value.trim();
  const recos = getSelectedRecos();
  addToCart(modalProduct, modalQty, notes, recos);
  closeModal();
}

/* ============= CART STATE ============= */
function recoKey(recos) {
  return (recos || []).map(r => r.id).sort().join(',');
}

function addToCart(product, qty, notes, recos) {
  const existing = cart.find(i =>
    i.product.id === product.id &&
    i.notes === notes &&
    recoKey(i.recos) === recoKey(recos)
  );
  if (existing) existing.qty += qty;
  else cart.push({ product, qty, notes, recos: recos ? [...recos] : [] });
  showToast(`${product.name} agregado 🎉`);
  renderCartBar();
  renderDrawer();
}

function removeFromCart(idx) {
  cart.splice(idx, 1);
  renderCartBar();
  renderDrawer();
}

function changeQty(idx, delta) {
  cart[idx].qty += delta;
  if (cart[idx].qty <= 0) removeFromCart(idx);
  else { renderCartBar(); renderDrawer(); }
}

function cartTotal() {
  return cart.reduce((s, i) => {
    const recoSum = (i.recos || []).reduce((rs, r) => rs + r.price, 0);
    return s + (i.product.price + recoSum) * i.qty;
  }, 0);
}

function cartCount() { return cart.reduce((s, i) => s + i.qty, 0); }

/* ============= CART BAR ============= */
function bindCartBar() {
  document.getElementById('cartBarBtn').addEventListener('click', openDrawer);
  document.getElementById('cartBar').addEventListener('click', openDrawer);
}

function renderCartBar() {
  const bar = document.getElementById('cartBar');
  if (cart.length === 0) { bar.classList.remove('visible'); return; }
  bar.classList.add('visible');
  const imgs = document.getElementById('cartBarImgs');
  imgs.innerHTML = '';
  cart.slice(0, 2).forEach(i => {
    const img = document.createElement('img');
    img.className = 'cart-thumb';
    img.src = i.product.img;
    img.alt = i.product.name;
    imgs.appendChild(img);
  });
  document.getElementById('cartBarItems').textContent = cartCount() + ' producto' + (cartCount() > 1 ? 's' : '');
  document.getElementById('cartBarTotal').textContent = '$' + cartTotal();
}

/* ============= DRAWER ============= */
function bindDrawer() {
  document.getElementById('drawerClose').addEventListener('click', closeDrawer);
  document.getElementById('drawerBackdrop').addEventListener('click', closeDrawer);
}

function openDrawer() {
  document.getElementById('drawerBackdrop').classList.add('open');
  document.getElementById('cartDrawer').classList.add('open');
  document.body.style.overflow = 'hidden';
  renderDrawer();
}

function closeDrawer() {
  document.getElementById('drawerBackdrop').classList.remove('open');
  document.getElementById('cartDrawer').classList.remove('open');
  document.body.style.overflow = '';
}

function removeReco(itemIdx, recoId) {
  const item = cart[itemIdx];
  if (!item) return;
  const i = item.recos.findIndex(r => r.id === recoId);
  if (i >= 0) item.recos.splice(i, 1);
  renderCartBar();
  renderDrawer();
}

function addRecoToItem(itemIdx, recoId) {
  const item = cart[itemIdx];
  if (!item) return;
  const r = recoProducts.find(x => x.id === recoId);
  if (r) item.recos.push(r);
  renderCartBar();
  renderDrawer();
}

function renderDrawer() {
  const body = document.getElementById('drawerBody');
  const total = document.getElementById('drawerTotal');
  total.textContent = '$' + cartTotal();
  if (cart.length === 0) {
    body.innerHTML = `<div class="drawer-empty"><div class="drawer-empty-icon">🛒</div><div class="drawer-empty-text">Tu canasta está vacía</div><div style="color:var(--text-muted);font-size:13px;margin-top:6px">Agrega algo rico del menú</div></div>`;
    return;
  }
  body.innerHTML = '';
  cart.forEach((item, idx) => {
    const wrap = document.createElement('div');
    wrap.className = 'cart-item-wrap';

    const deleteBg = document.createElement('div');
    deleteBg.className = 'cart-item-delete-bg';
    deleteBg.innerHTML = `<div class="delete-label">🗑 Eliminar</div>`;
    deleteBg.addEventListener('click', () => removeFromCart(idx));

    const el = document.createElement('div');
    el.className = 'cart-item';
    el.style.flexDirection = 'column';
    el.style.alignItems = 'stretch';

    const recoSum = (item.recos || []).reduce((s, r) => s + r.price, 0);
    const unitPrice = item.product.price + recoSum;
    const noteStr = item.notes ? '📝 ' + item.notes : '';

    // Top row: image + name/price + qty controls
    const topRow = document.createElement('div');
    topRow.style.cssText = 'display:flex;align-items:center;gap:12px;';
    topRow.innerHTML = `
      <img class="cart-item-img" src="${item.product.img}" alt="${item.product.name}">
      <div class="cart-item-info" style="flex:1;min-width:0;">
        <div class="cart-item-name">${item.product.name}</div>
        <div class="cart-item-price">$${unitPrice * item.qty}</div>
        ${noteStr ? `<div class="cart-item-note">${noteStr}</div>` : ''}
      </div>
      <div class="cart-qty-ctrl">
        ${item.qty === 1
          ? `<button class="cart-qty-btn del-btn" data-idx="${idx}" data-action="del">🗑</button>`
          : `<button class="cart-qty-btn" data-idx="${idx}" data-action="minus">−</button>`}
        <span class="cart-qty-num">${item.qty}</span>
        <button class="cart-qty-btn" data-idx="${idx}" data-action="plus">+</button>
      </div>
    `;
    topRow.addEventListener('click', e => {
      const btn = e.target.closest('[data-action]');
      if (!btn) return;
      const i = parseInt(btn.dataset.idx);
      if (btn.dataset.action === 'plus') changeQty(i, 1);
      else if (btn.dataset.action === 'minus') changeQty(i, -1);
      else if (btn.dataset.action === 'del') showDeleteSwipe(wrap, deleteBg, el);
    });
    el.appendChild(topRow);

    // Extras section (grouped by id, each shown as individual removable row)
    if (item.recos && item.recos.length > 0) {
      // Build unique list with counts to render each instance separately
      const extrasSection = document.createElement('div');
      extrasSection.className = 'cart-extras';
      extrasSection.innerHTML = `<div class="cart-extras-label">Extras</div>`;

      // Group by id but render one row per unique id with qty
      const seen = {};
      item.recos.forEach(r => {
        if (!seen[r.id]) {
          seen[r.id] = { r, count: 0 };
        }
        seen[r.id].count++;
      });

      Object.values(seen).forEach(({ r, count }) => {
        const row = document.createElement('div');
        row.className = 'cart-extra-row';
        row.innerHTML = `
          <span class="cart-extra-name">${r.name}</span>
          <span class="cart-extra-price">$${r.price * count}</span>
          <div class="cart-extra-ctrl">
            <button class="cart-extra-btn minus" title="Quitar">−</button>
            <span class="cart-extra-qty">${count}</span>
            <button class="cart-extra-btn plus" title="Agregar">+</button>
          </div>
        `;
        row.querySelector('.cart-extra-btn.minus').addEventListener('click', () => removeReco(idx, r.id));
        row.querySelector('.cart-extra-btn.plus').addEventListener('click', () => addRecoToItem(idx, r.id));
        extrasSection.appendChild(row);
      });

      el.appendChild(extrasSection);
    }

    wrap.appendChild(deleteBg);
    wrap.appendChild(el);
    body.appendChild(wrap);
    setupSwipe(el, wrap, deleteBg, idx);
  });
}

/* ============= SWIPE TO DELETE ============= */
function showDeleteSwipe(wrap, bg, el) {
  bg.classList.add('visible');
  el.style.transform = 'translateX(-80px)';
}

function setupSwipe(el, wrap, bg, idx) {
  let startX = 0, dx = 0, swiping = false;
  const THRESHOLD = 60;
  el.addEventListener('touchstart', e => { startX = e.touches[0].clientX; swiping = true; dx = 0; }, { passive:true });
  el.addEventListener('touchmove', e => {
    if (!swiping) return;
    dx = e.touches[0].clientX - startX;
    if (dx < 0) { el.style.transition = 'none'; el.style.transform = `translateX(${Math.max(dx, -100)}px)`; bg.classList.add('visible'); }
    else { el.style.transition = 'none'; el.style.transform = 'translateX(0)'; bg.classList.remove('visible'); }
  }, { passive:true });
  el.addEventListener('touchend', () => {
    el.style.transition = 'transform .25s ease';
    if (dx < -THRESHOLD) { el.style.transform = 'translateX(-80px)'; bg.classList.add('visible'); }
    else { el.style.transform = 'translateX(0)'; bg.classList.remove('visible'); }
    swiping = false;
  });
}

/* ============= ADDRESS MODAL ============= */
let addrMap = null;
let addrMarker = null;
let addrLat = 19.847, addrLng = -90.5209; // Campeche centro
let addrLabel = '';
let addrGeocodeTimer = null;
let addrMapMoved = false; // rastrea si el usuario movió el mapa

function updateConfirmBtn() {
  const specs = document.getElementById('addrSpecs').value.trim();
  const btn = document.getElementById('addrConfirm');
  const hint = document.getElementById('addrRequiredHint');
  const streetRow = document.getElementById('addrStreetRow');
  const ready = addrMapMoved && specs.length > 0;
  btn.disabled = !ready;
  hint.classList.toggle('visible', !ready);
  streetRow.classList.toggle('required', !addrMapMoved);
}

function openAddrModal() {
  if (cart.length === 0) { showToast('Tu canasta está vacía'); return; }
  addrMapMoved = false;
  document.getElementById('addrSpecs').value = '';
  document.getElementById('addrBackdrop').classList.add('open');
  document.getElementById('addrModal').classList.add('open');
  document.body.style.overflow = 'hidden';
  updateConfirmBtn();

  setTimeout(() => {
    if (!addrMap) {
      // Primero inicializa el mapa, luego pide ubicación
      initAddrMap(() => {
        pedirUbicacion();
      });
    } else {
      addrMap.invalidateSize();
      pedirUbicacion();
    }
  }, 80);
}

function pedirUbicacion() {
  if (!navigator.geolocation) {
    // Sin geolocalización, solo muestra Campeche
    return;
  }
  document.getElementById('addrStreetText').textContent = '📡 Obteniendo tu ubicación…';
  navigator.geolocation.getCurrentPosition(
    pos => {
      addrLat = pos.coords.latitude;
      addrLng = pos.coords.longitude;
      addrMapMoved = true;
      if (addrMap) addrMap.setView([addrLat, addrLng], 17);
      reverseGeocode(addrLat, addrLng);
      updateConfirmBtn();
    },
    () => {
      // Si rechaza, queda en Campeche centro
      document.getElementById('addrStreetText').textContent = 'Mueve el mapa para seleccionar tu dirección';
    },
    { timeout: 8000, enableHighAccuracy: true }
  );
}

function closeAddrModal() {
  document.getElementById('addrBackdrop').classList.remove('open');
  document.getElementById('addrModal').classList.remove('open');
  document.body.style.overflow = '';
}

function initAddrMap(callback) {
  if (!window.L) {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js';
    s.onload = () => { setupLeaflet(); if (callback) callback(); };
    document.head.appendChild(s);
  } else {
    setupLeaflet();
    if (callback) callback();
  }
}

function setupLeaflet() {
  addrMap = L.map('addrMap', { zoomControl: false, attributionControl: false }).setView([addrLat, addrLng], 16);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(addrMap);
  L.control.zoom({ position: 'bottomleft' }).addTo(addrMap);

  addrMap.on('movestart', () => {
    const pin = document.getElementById('addrPin');
    if (!pin) return;
    pin.classList.remove('pin-drop');
    pin.classList.add('pin-drag');
  });

  addrMap.on('moveend', () => {
    const pin = document.getElementById('addrPin');
    if (pin) {
      pin.classList.remove('pin-drag');
      void pin.offsetWidth;
      pin.classList.add('pin-drop');
      setTimeout(() => pin.classList.remove('pin-drop'), 400);
    }
    const c = addrMap.getCenter();
    addrLat = c.lat; addrLng = c.lng;
    addrMapMoved = true;
    reverseGeocode(addrLat, addrLng);
    updateConfirmBtn();
  });
}

function reverseGeocode(lat, lng) {
  const el = document.getElementById('addrStreetText');
  el.textContent = 'Buscando dirección…';
  clearTimeout(addrGeocodeTimer);
  addrGeocodeTimer = setTimeout(() => {
    fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lng}&format=json&accept-language=es`)
      .then(r => r.json())
      .then(d => {
        const a = d.address || {};
        const parts = [
          a.road || a.pedestrian || a.footway || '',
          a.house_number || '',
          a.suburb || a.neighbourhood || a.quarter || '',
          a.city || a.town || a.village || a.municipality || ''
        ].filter(Boolean);
        addrLabel = parts.join(', ') || d.display_name || 'Dirección seleccionada';
        el.textContent = addrLabel;
      })
      .catch(() => { addrLabel = `${lat.toFixed(5)}, ${lng.toFixed(5)}`; el.textContent = addrLabel; });
  }, 600);
}

function geolocateUser() {
  pedirUbicacion();
}

function bindAddrModal() {
  document.getElementById('payBtn').addEventListener('click', openAddrModal);
  document.getElementById('addrBack').addEventListener('click', closeAddrModal);
  document.getElementById('addrBackdrop').addEventListener('click', closeAddrModal);
  document.getElementById('addrLocate').addEventListener('click', geolocateUser);
  document.getElementById('addrConfirm').addEventListener('click', sendWhatsApp);
  document.getElementById('addrSpecs').addEventListener('input', updateConfirmBtn);
}

/* ============= WHATSAPP ============= */
function sendWhatsApp() {
  if (cart.length === 0) { showToast('Tu canasta está vacía'); return; }
  const specs = document.getElementById('addrSpecs').value.trim();
  if (!addrMapMoved) { showToast('Por favor selecciona tu ubicación en el mapa'); return; }
  if (!specs) { showToast('Por favor agrega las especificaciones de tu dirección'); return; }
  const WA_NUMBER = '529811064643';
  let msg = '🛵 *Nuevo Pedido — La Cantina*\n';
  msg += '━━━━━━━━━━━━━━━━━━━━\n\n';
  cart.forEach((item, i) => {
    const recoSum = (item.recos || []).reduce((s, r) => s + r.price, 0);
    const unitPrice = item.product.price + recoSum;
    msg += `*${i + 1}. ${item.product.name}*\n`;
    msg += `   Cantidad: ${item.qty}\n`;
    msg += `   Precio unitario: $${unitPrice}\n`;
    msg += `   Subtotal: $${unitPrice * item.qty}\n`;
    if (item.recos && item.recos.length > 0) {
      const recoMap = {};
      item.recos.forEach(r => { recoMap[r.name] = (recoMap[r.name]||0)+1; });
      const recoStr = Object.entries(recoMap).map(([n,q]) => q>1?`${n} x${q}`:n).join(', ');
      msg += `   ➕ Extras: ${recoStr}\n`;
    }
    if (item.notes) msg += `   📝 Notas: ${item.notes}\n`;
    msg += '\n';
  });
  msg += '━━━━━━━━━━━━━━━━━━━━\n';
  msg += `💰 *Total: $${cartTotal()}*\n\n`;
  msg += `📍 *Dirección:* ${addrLabel || 'No especificada'}\n`;
  if (specs) msg += `🏠 *Especificaciones:* ${specs}\n`;
  msg += `🗺️ https://www.google.com/maps?q=${addrLat},${addrLng}\n\n`;
  msg += '¡Gracias por tu pedido! 🙌';
  const url = `https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(msg)}`;
  window.open(url, '_blank');
  closeAddrModal();
}

/* ============= TOAST ============= */
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}
